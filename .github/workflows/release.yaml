name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the manifest version
        run: |
          set -o errexit -o pipefail -o nounset
          manifest_version="$(jq -r .version custom_components/movistar_rft8115vw/manifest.json)"
          if [[ "$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o pipefail -o nounset
          # Release notes: the CHANGELOG.md section headed "## <tag>".
          notes="$(awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md)"
          args=("$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME")
          if [[ -n "${notes//[[:space:]]/}" ]]; then
            args+=(--notes "$notes")
          else
            args+=(--generate-notes)
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
