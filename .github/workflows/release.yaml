name: Release

# Publishes a release when a version that has no release yet reaches main.
# Merge a pull request with a bumped manifest version and a matching
# "## <version>" CHANGELOG section; the tag is created automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release for a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o errexit -o pipefail -o nounset
          version="$(jq -r .version custom_components/movistar_rft8115vw/manifest.json)"
          if git rev-parse --quiet --verify "refs/tags/$version" >/dev/null; then
            echo "Version $version is already released; nothing to do."
            exit 0
          fi
          # Release notes: the CHANGELOG.md section headed "## <version>".
          notes="$(awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          args=("$version" --target "$GITHUB_SHA" --title "$version" --notes "$notes")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
